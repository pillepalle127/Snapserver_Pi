# Virtual PipeWire sink used as the fixed audio destination.
# Incoming A2DP audio is routed here and written to Snapserver's FIFO.
context.modules = [
  {
    name = libpipewire-module-pipe-tunnel
    args = {
      tunnel.mode      = sink
      pipe.filename    = "/tmp/snapfifo"
      node.name        = "snapserver"
      node.description = "Snapcast Multiroom"
      media.class      = "Audio/Sink"
      audio.format     = "S16LE"
      audio.rate       = 48000
      audio.channels   = 2
      audio.position   = [ FL FR ]
    }
  }
]
