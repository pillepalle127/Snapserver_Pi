# Snapserver static configuration.
# Bluetooth audio reaches this server through /tmp/snapfifo. PipeWire writes
# signed little-endian PCM at 48 kHz, 16-bit, stereo into that named pipe.

[server]
# Let Snapserver choose a sensible worker count for the Raspberry Pi.
threads = -1

[http]
# JSON-RPC/WebSocket API and Snapweb, if web assets are installed.
enabled = true
bind_to_address = 0.0.0.0
port = 1780

[tcp]
# Legacy TCP JSON-RPC control API used by compatible clients.
enabled = true
bind_to_address = 0.0.0.0
port = 1705

[stream]
# TCP audio stream for Snapclients.
bind_to_address = 0.0.0.0
port = 1704
# Opus is low-latency and network-efficient. chunk_ms=20 matches the PipeWire
# stream format and works well for ESP-based Snapclients.
source = pipe:///tmp/snapfifo?name=Bluetooth&sampleformat=48000:16:2&codec=opus&chunk_ms=20
buffer = 1000
send_to_muted = false

[streaming_client]
initial_volume = 100

[logging]
# Send logs to journald. View with: sudo journalctl -u snapserver -f
sink = system
filter = *:info
