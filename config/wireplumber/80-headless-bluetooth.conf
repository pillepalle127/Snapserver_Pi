# Permit the dedicated user session to manage Bluetooth audio on a headless Pi,
# even when no local graphical or active TTY session exists.
wireplumber.profiles = {
  main = {
    monitor.bluez.seat-monitoring = disabled
  }
}

# The Pi is a music receiver, so only the A2DP sink role is required.
monitor.bluez.properties = {
  bluez5.roles = [ a2dp_sink ]
  bluez5.default.rate = 48000
  bluez5.default.channels = 2
}
